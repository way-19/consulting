<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Consulting19 - Client Dashboard</title>
    <meta name="description" content="Consulting19 client dashboard for managing projects and services" />
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="C19 Client" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    
    <!-- Mobile Optimization -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <!-- Loading Screen -->
      <div id="loading-screen" style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: white;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        z-index: 9999;
      ">
        <!-- Logo -->
        <div style="
          width: 80px;
          height: 80px;
          background: rgba(255, 255, 255, 0.2);
          border-radius: 20px;
          display: flex;
          align-items: center;
          justify-content: center;
          margin-bottom: 24px;
          backdrop-filter: blur(10px);
          border: 1px solid rgba(255, 255, 255, 0.3);
        ">
          <div style="
            font-size: 32px;
            font-weight: 700;
            color: white;
          ">C19</div>
        </div>
        
        <!-- Title -->
        <h1 style="
          font-size: 28px;
          font-weight: 700;
          margin: 0 0 8px 0;
          text-align: center;
        ">Consulting19</h1>
        
        <!-- Subtitle -->
        <p style="
          font-size: 16px;
          font-weight: 400;
          margin: 0 0 32px 0;
          opacity: 0.9;
          text-align: center;
        ">Client Dashboard</p>
        
        <!-- Loading Animation -->
        <div style="
          width: 50px;
          height: 50px;
          position: relative;
        ">
          <div style="
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
          "></div>
        </div>
        
        <!-- Loading Text -->
        <p style="
          font-size: 14px;
          font-weight: 500;
          margin: 16px 0 0 0;
          opacity: 0.8;
          text-align: center;
        ">Loading your dashboard...</p>
        
        <!-- Progress Bar -->
        <div style="
          width: 200px;
          height: 4px;
          background: rgba(255, 255, 255, 0.2);
          border-radius: 2px;
          margin-top: 20px;
          overflow: hidden;
        ">
          <div style="
            width: 0%;
            height: 100%;
            background: white;
            border-radius: 2px;
            animation: progress 2s ease-in-out infinite;
          "></div>
        </div>
      </div>
      
      <!-- CSS Animations -->
      <style>
        @keyframes spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
        
        @keyframes progress {
          0% { width: 0%; }
          50% { width: 70%; }
          100% { width: 100%; }
        }
        
        @keyframes fadeIn {
          from { opacity: 0; transform: translateY(20px); }
          to { opacity: 1; transform: translateY(0); }
        }
        
        #loading-screen > * {
          animation: fadeIn 0.6s ease-out;
        }
      </style>
    </div>
    
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Remove loading screen when React app loads -->
    <script>
      // Hide loading screen when React app mounts
      window.addEventListener('DOMContentLoaded', function() {
        // Give React some time to mount
        setTimeout(function() {
          const loadingScreen = document.getElementById('loading-screen');
          if (loadingScreen && document.querySelector('[data-reactroot], #root > *:not(#loading-screen)')) {
            loadingScreen.style.transition = 'opacity 0.5s ease-out';
            loadingScreen.style.opacity = '0';
            setTimeout(function() {
              if (loadingScreen.parentNode) {
                loadingScreen.parentNode.removeChild(loadingScreen);
              }
            }, 500);
          }
        }, 1000);
      });
      
      // Fallback: Remove loading screen after maximum time
      setTimeout(function() {
        const loadingScreen = document.getElementById('loading-screen');
        if (loadingScreen) {
          loadingScreen.style.transition = 'opacity 0.5s ease-out';
          loadingScreen.style.opacity = '0';
          setTimeout(function() {
            if (loadingScreen.parentNode) {
              loadingScreen.parentNode.removeChild(loadingScreen);
            }
          }, 500);
        }
      }, 5000);
    </script>
  </body>
</html>
