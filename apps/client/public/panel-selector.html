<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulting19 - Panel Seçici</title>
    <style>
        body {
            font-family: 'Inter', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            max-width: 600px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            font-size: 1.2em;
            margin-bottom: 40px;
            opacity: 0.9;
        }
        
        .panel-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 30px;
        }
        
        .panel-btn {
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.3);
            color: white;
            padding: 20px 30px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: 600;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
            min-width: 180px;
        }
        
        .panel-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .panel-btn.client {
            border-color: #4CAF50;
        }
        
        .panel-btn.consultant {
            border-color: #FF9800;
        }
        
        .quick-switch {
            margin-top: 30px;
            padding: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .switch-info {
            font-size: 0.9em;
            opacity: 0.8;
            margin-bottom: 15px;
        }
        
        .switch-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        
        .switch-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s;
        }
        
        .switch-btn:hover {
            background: rgba(255,255,255,0.2);
        }
        
        @media (max-width: 768px) {
            .panel-buttons {
                flex-direction: column;
                align-items: center;
            }
            
            .panel-btn {
                width: 80%;
                margin: 10px 0;
            }
            
            .switch-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏢 CONSULTING19</h1>
        <div class="subtitle">İki paneli aynı anda yönetmek için çözümler</div>
        
        <div class="panel-buttons">
            <a href="javascript:switchToClient()" class="panel-btn client">
                🏠 Client Panel<br>
                <small>Müşteri Dashboard</small>
            </a>
            <a href="javascript:switchToConsultant()" class="panel-btn consultant">
                👨‍💼 Consultant Panel<br>
                <small>Danışman Dashboard</small>
            </a>
        </div>
        
        <div class="quick-switch">
            <div class="switch-info">
                ⚡ Hızlı Panel Değiştirme Komutları
            </div>
            <div class="switch-buttons">
                <button class="switch-btn" onclick="executeCommand('client')">
                    Client Komutu Çalıştır
                </button>
                <button class="switch-btn" onclick="executeCommand('consultant')">
                    Consultant Komutu Çalıştır
                </button>
            </div>
        </div>
        
        <div style="margin-top: 30px; font-size: 0.9em; opacity: 0.7;">
            <p>✅ Her iki panel de hazır ve çalışır durumda</p>
            <p>🔄 3-5 saniyede panel değişimi</p>
            <p>🎯 Demo için ideal çözüm</p>
        </div>
    </div>
    
    <script>
        function switchToClient() {
            showLoading('Client Panel yükleniyor...');
            executeCommand('client');
        }
        
        function switchToConsultant() {
            showLoading('Consultant Panel yükleniyor...');
            executeCommand('consultant');
        }
        
        function executeCommand(panel) {
            // Ana sayfaya yönlendir ve panel bilgisini localStorage'a kaydet
            localStorage.setItem('selectedPanel', panel);
            window.location.href = '/?panel=' + panel;
        }
        
        function showLoading(text) {
            document.body.innerHTML = `
                <div style="display: flex; justify-content: center; align-items: center; height: 100vh; color: white; font-size: 1.2em;">
                    <div style="text-align: center;">
                        <div style="width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.3); border-top: 4px solid white; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px;"></div>
                        ${text}
                    </div>
                </div>
                <style>
                @keyframes spin {
                    0% { transform: rotate(0deg); }
                    100% { transform: rotate(360deg); }
                }
                </style>
            `;
        }
        
        // URL parameter kontrolü
        const urlParams = new URLSearchParams(window.location.search);
        const selectedPanel = urlParams.get('panel');
        
        if (selectedPanel) {
            if (selectedPanel === 'client') {
                switchToClient();
            } else if (selectedPanel === 'consultant') {
                switchToConsultant();
            }
        }
    </script>
</body>
</html>
