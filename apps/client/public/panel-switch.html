<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulting19 - Panel Switch</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            position: relative;
        }
        
        .control-bar {
            background: rgba(0,0,0,0.2);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .logo {
            font-size: 1.5em;
            font-weight: 700;
        }
        
        .panel-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .panel-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
            font-size: 1em;
        }
        
        .panel-btn:hover {
            background: rgba(255,255,255,0.4);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .panel-btn.active {
            background: rgba(255,255,255,0.9);
            color: #667eea;
        }
        
        .panel-btn:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }
        
        .main-content {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 80px);
            padding: 20px;
        }
        
        .panel-display {
            text-align: center;
            padding: 40px;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            max-width: 800px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .panel-title {
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }
        
        .status-badge {
            padding: 15px 30px;
            border-radius: 10px;
            margin: 20px 0;
            font-size: 1.2em;
            font-weight: 600;
        }
        
        .client-badge {
            background: #4CAF50;
        }
        
        .consultant-badge {
            background: #FF9800;
        }
        
        .panel-description {
            font-size: 1.1em;
            opacity: 0.9;
            margin-bottom: 30px;
        }
        
        .feature-list {
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 10px;
            text-align: left;
        }
        
        .feature-list h3 {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .feature-list ul {
            list-style: none;
            padding: 0;
        }
        
        .feature-list li {
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .feature-list li:last-child {
            border-bottom: none;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
            font-size: 0.9em;
        }
        
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 1.2em;
            z-index: 1000;
            visibility: hidden;
        }
        
        .loading-overlay.show {
            visibility: visible;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            .control-bar {
                flex-direction: column;
                text-align: center;
            }
            
            .panel-buttons {
                justify-content: center;
                width: 100%;
            }
            
            .panel-btn {
                flex: 1;
                margin: 0 5px;
            }
            
            .panel-title {
                font-size: 2em;
            }
            
            .info-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="control-bar">
        <div class="logo">🏢 CONSULTING19</div>
        <div class="panel-buttons">
            <button class="panel-btn active" id="clientBtn" onclick="switchToClient()">
                🏠 Client Panel
            </button>
            <button class="panel-btn" id="consultantBtn" onclick="switchToConsultant()">
                👨‍💼 Consultant Panel
            </button>
            <button class="panel-btn" onclick="refreshPanel()">
                🔄 Yenile
            </button>
        </div>
    </div>

    <div class="main-content">
        <div class="panel-display" id="panelDisplay">
            <!-- Panel content will be loaded here -->
        </div>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div id="loadingText">Panel değiştiriliyor...</div>
    </div>

    <script>
        let currentPanel = 'client';
        let isLoading = false;

        const clientContent = `
            <div class="panel-title">🏠 CLIENT PANEL</div>
            <div class="status-badge client-badge">✅ Client Dashboard Aktif!</div>
            <div class="panel-description">
                Consulting19 Client Dashboard - Müşteri Yönetim Paneli
            </div>
            <div class="feature-list">
                <h3>Client Panel Özellikleri:</h3>
                <ul>
                    <li>📋 Proje yönetimi ve takibi</li>
                    <li>📊 İlerleme raporları görüntüleme</li>
                    <li>💬 Danışman ile mesajlaşma</li>
                    <li>📄 Belge paylaşımı ve indirme</li>
                    <li>💰 Fatura görüntüleme ve ödeme</li>
                    <li>📅 Toplantı planları görüntüleme</li>
                    <li>⭐ Hizmet değerlendirme</li>
                </ul>
                <div class="info-grid">
                    <div><strong>Zaman:</strong> ${new Date().toLocaleString('tr-TR')}</div>
                    <div><strong>Rol:</strong> Müşteri</div>
                    <div><strong>Durum:</strong> Aktif</div>
                    <div><strong>Panel:</strong> Client Dashboard</div>
                </div>
            </div>
        `;

        const consultantContent = `
            <div class="panel-title">👨‍💼 CONSULTANT PANEL</div>
            <div class="status-badge consultant-badge">✅ Consultant Dashboard Aktif!</div>
            <div class="panel-description">
                Consulting19 Consultant Dashboard - Danışman Yönetim Paneli
            </div>
            <div class="feature-list">
                <h3>Consultant Panel Özellikleri:</h3>
                <ul>
                    <li>👥 Müşteri yönetimi ve iletişim</li>
                    <li>📈 Finansal raporlar ve analiz</li>
                    <li>⏰ Zaman takibi ve faturalandırma</li>
                    <li>📋 Proje planlama ve analiz</li>
                    <li>💼 İş akışı yönetimi</li>
                    <li>📊 Performans metrikleri</li>
                    <li>🎯 Hedef belirleme ve takip</li>
                </ul>
                <div class="info-grid">
                    <div><strong>Zaman:</strong> ${new Date().toLocaleString('tr-TR')}</div>
                    <div><strong>Rol:</strong> Danışman</div>
                    <div><strong>Durum:</strong> Aktif</div>
                    <div><strong>Panel:</strong> Consultant Dashboard</div>
                </div>
            </div>
        `;

        function showLoading(text) {
            if (isLoading) return;
            isLoading = true;
            
            document.getElementById('loadingText').textContent = text;
            document.getElementById('loadingOverlay').classList.add('show');
            
            // Disable buttons
            document.querySelectorAll('.panel-btn').forEach(btn => {
                btn.disabled = true;
            });
        }

        function hideLoading() {
            setTimeout(() => {
                document.getElementById('loadingOverlay').classList.remove('show');
                isLoading = false;
                
                // Enable buttons
                document.querySelectorAll('.panel-btn').forEach(btn => {
                    btn.disabled = false;
                });
            }, 1500);
        }

        function updateButtons(activePanel) {
            document.getElementById('clientBtn').classList.toggle('active', activePanel === 'client');
            document.getElementById('consultantBtn').classList.toggle('active', activePanel === 'consultant');
        }

        function switchToClient() {
            if (currentPanel === 'client' || isLoading) return;
            
            showLoading('Client Panel yükleniyor...');
            currentPanel = 'client';
            
            setTimeout(() => {
                document.getElementById('panelDisplay').innerHTML = clientContent;
                updateButtons('client');
                hideLoading();
                
                // Update URL
                const newUrl = window.location.pathname + '?panel=client';
                window.history.replaceState({}, '', newUrl);
            }, 1000);
        }

        function switchToConsultant() {
            if (currentPanel === 'consultant' || isLoading) return;
            
            showLoading('Consultant Panel yükleniyor...');
            currentPanel = 'consultant';
            
            setTimeout(() => {
                document.getElementById('panelDisplay').innerHTML = consultantContent;
                updateButtons('consultant');
                hideLoading();
                
                // Update URL
                const newUrl = window.location.pathname + '?panel=consultant';
                window.history.replaceState({}, '', newUrl);
            }, 1000);
        }

        function refreshPanel() {
            if (isLoading) return;
            
            if (currentPanel === 'client') {
                switchToClient();
            } else {
                switchToConsultant();
            }
        }

        // Initialize on page load
        function initialize() {
            const urlParams = new URLSearchParams(window.location.search);
            const panelParam = urlParams.get('panel');
            
            if (panelParam === 'consultant') {
                currentPanel = 'consultant';
                document.getElementById('panelDisplay').innerHTML = consultantContent;
                updateButtons('consultant');
            } else {
                currentPanel = 'client';
                document.getElementById('panelDisplay').innerHTML = clientContent;
                updateButtons('client');
            }
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey || e.metaKey) {
                if (e.key === '1') {
                    e.preventDefault();
                    switchToClient();
                } else if (e.key === '2') {
                    e.preventDefault();
                    switchToConsultant();
                } else if (e.key === 'r') {
                    e.preventDefault();
                    refreshPanel();
                }
            }
        });

        // Initialize when page loads
        window.onload = initialize;
    </script>
</body>
</html>
