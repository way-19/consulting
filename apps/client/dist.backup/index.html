<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Consulting19 - Client Dashboard</title>
    <meta name="description" content="Consulting19 client dashboard for managing projects and services" />
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="C19 Client" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    
    <!-- Mobile Optimization -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <script type="module" crossorigin src="/assets/index-Bh8cD5cr.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-D69Y2EzY.css">
  </head>
  <body>
    <div id="root">
      <!-- Loading Screen -->
      <div id="loading-screen" style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: white;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        z-index: 9999;
      ">
        <!-- Logo -->
        <div style="
          width: 80px;
          height: 80px;
          background: rgba(255, 255, 255, 0.2);
          border-radius: 20px;
          display: flex;
          align-items: center;
          justify-content: center;
          margin-bottom: 24px;
          backdrop-filter: blur(10px);
          border: 1px solid rgba(255, 255, 255, 0.3);
        ">
          <div style="
            font-size: 32px;
            font-weight: 700;
            color: white;
          ">C19</div>
        </div>
        
        <!-- Title -->
        <h1 style="
          font-size: 28px;
          font-weight: 700;
          margin: 0 0 8px 0;
          text-align: center;
        ">Consulting19</h1>
        
        <!-- Subtitle -->
        <p style="
          font-size: 16px;
          font-weight: 400;
          margin: 0 0 32px 0;
          opacity: 0.9;
          text-align: center;
        ">Client Dashboard</p>
        
        <!-- Loading Animation -->
        <div style="
          width: 50px;
          height: 50px;
          position: relative;
        ">
          <div style="
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
          "></div>
        </div>
        
        <!-- Loading Text -->
        <p style="
          font-size: 14px;
          font-weight: 500;
          margin: 16px 0 0 0;
          opacity: 0.8;
          text-align: center;
        ">Loading your dashboard...</p>
        
        <!-- Progress Bar -->
        <div style="
          width: 200px;
          height: 4px;
          background: rgba(255, 255, 255, 0.2);
          border-radius: 2px;
          margin-top: 20px;
          overflow: hidden;
        ">
          <div style="
            width: 0%;
            height: 100%;
            background: white;
            border-radius: 2px;
            animation: progress 2s ease-in-out infinite;
          "></div>
        </div>
      </div>
      
      <!-- CSS Animations -->
      <style>
        @keyframes spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
        
        @keyframes progress {
          0% { width: 0%; }
          50% { width: 70%; }
          100% { width: 100%; }
        }
        
        @keyframes fadeIn {
          from { opacity: 0; transform: translateY(20px); }
          to { opacity: 1; transform: translateY(0); }
        }
        
        #loading-screen > * {
          animation: fadeIn 0.6s ease-out;
        }
      </style>
    </div>
    
    
    <!-- Remove loading screen when React app loads -->
    <script>
      // Panel selector functionality
      function checkPanelSelector() {
        const urlParams = new URLSearchParams(window.location.search);
        const panelParam = urlParams.get('panel');
        const selectorParam = urlParams.get('selector');
        
        if (selectorParam === 'true') {
          // Panel seçici göster
          showPanelSelector();
          return;
        }
        
        if (panelParam === 'consultant') {
          // Consultant paneline yönlendir
          switchToConsultantPanel();
          return;
        }
      }
      
      function showPanelSelector() {
        document.body.innerHTML = `
          <div style="
            font-family: 'Inter', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
          ">
            <div style="
              text-align: center;
              padding: 40px;
              background: rgba(255,255,255,0.1);
              border-radius: 20px;
              backdrop-filter: blur(10px);
              max-width: 600px;
              box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            ">
              <h1 style="font-size: 2.5em; margin-bottom: 20px;">🏢 CONSULTING19</h1>
              <div style="font-size: 1.2em; margin-bottom: 40px; opacity: 0.9;">Panel Seçici</div>
              
              <div style="display: flex; gap: 20px; justify-content: center; margin-bottom: 30px; flex-wrap: wrap;">
                <a href="?panel=client" style="
                  background: rgba(255,255,255,0.2);
                  border: 2px solid #4CAF50;
                  color: white;
                  padding: 20px 30px;
                  border-radius: 15px;
                  cursor: pointer;
                  font-size: 1.1em;
                  font-weight: 600;
                  text-decoration: none;
                  display: inline-block;
                  min-width: 180px;
                  transition: all 0.3s;
                " onmouseover="this.style.background='rgba(255,255,255,0.3)'; this.style.transform='translateY(-5px)'"
                   onmouseout="this.style.background='rgba(255,255,255,0.2)'; this.style.transform='translateY(0)'">
                  🏠 Client Panel<br>
                  <small>Müşteri Dashboard</small>
                </a>
                
                <a href="javascript:switchToConsultant()" style="
                  background: rgba(255,255,255,0.2);
                  border: 2px solid #FF9800;
                  color: white;
                  padding: 20px 30px;
                  border-radius: 15px;
                  cursor: pointer;
                  font-size: 1.1em;
                  font-weight: 600;
                  text-decoration: none;
                  display: inline-block;
                  min-width: 180px;
                  transition: all 0.3s;
                " onmouseover="this.style.background='rgba(255,255,255,0.3)'; this.style.transform='translateY(-5px)'"
                   onmouseout="this.style.background='rgba(255,255,255,0.2)'; this.style.transform='translateY(0)'">
                  👨‍💼 Consultant Panel<br>
                  <small>Danışman Dashboard</small>
                </a>
              </div>
              
              <div style="margin-top: 30px; font-size: 0.9em; opacity: 0.7;">
                <p>✅ Her iki panel de hazır ve çalışır durumda</p>
                <p>🔄 Anında panel değişimi</p>
                <p>🎯 Demo için ideal çözüm</p>
              </div>
            </div>
          </div>
        `;
      }
      
      function switchToConsultant() {
        document.body.innerHTML = \`
          <div style="display: flex; justify-content: center; align-items: center; height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; font-size: 1.2em;">
            <div style="text-align: center;">
              <div style="width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.3); border-top: 4px solid white; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px;"></div>
              Consultant Panel yükleniyor...
            </div>
          </div>
          <style>
          @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
          }
          </style>
        \`;
        
        // Consultant paneline yönlendirme simülasyonu
        setTimeout(() => {
          fetch('/api/switch-to-consultant', { method: 'POST' })
            .then(() => {
              location.href = '?panel=consultant';
            })
            .catch(() => {
              location.href = '?panel=consultant';
            });
        }, 1500);
      }
      
      function switchToConsultantPanel() {
        // Consultant paneli için özel yükleme
        document.getElementById('loading-screen').innerHTML = \`
          <div style="text-align: center;">
            <div style="
              width: 80px;
              height: 80px;
              background: rgba(255, 255, 255, 0.2);
              border-radius: 20px;
              display: flex;
              align-items: center;
              justify-content: center;
              margin-bottom: 24px;
              backdrop-filter: blur(10px);
              border: 1px solid rgba(255, 255, 255, 0.3);
            ">
              <div style="font-size: 32px; font-weight: 700; color: white;">👨‍💼</div>
            </div>
            
            <h1 style="font-size: 28px; font-weight: 700; margin: 0 0 8px 0;">Consulting19</h1>
            <p style="font-size: 16px; margin: 0 0 32px 0; opacity: 0.9;">Consultant Dashboard</p>
            
            <div style="width: 50px; height: 50px; position: relative;">
              <div style="
                width: 50px;
                height: 50px;
                border: 3px solid rgba(255, 255, 255, 0.3);
                border-top: 3px solid white;
                border-radius: 50%;
                animation: spin 1s linear infinite;
              "></div>
            </div>
            
            <p style="font-size: 14px; margin: 16px 0 0 0; opacity: 0.8;">Consultant panel yükleniyor...</p>
          </div>
        \`;
      }
      
      // Sayfa yüklendiğinde panel kontrolü yap
      window.addEventListener('DOMContentLoaded', function() {
        checkPanelSelector();
        
        // Give React some time to mount
        setTimeout(function() {
          const loadingScreen = document.getElementById('loading-screen');
          if (loadingScreen && document.querySelector('[data-reactroot], #root > *:not(#loading-screen)')) {
            loadingScreen.style.transition = 'opacity 0.5s ease-out';
            loadingScreen.style.opacity = '0';
            setTimeout(function() {
              if (loadingScreen.parentNode) {
                loadingScreen.parentNode.removeChild(loadingScreen);
              }
            }, 500);
          }
        }, 1000);
      });
      
      // Fallback: Remove loading screen after maximum time
      setTimeout(function() {
        const loadingScreen = document.getElementById('loading-screen');
        if (loadingScreen) {
          loadingScreen.style.transition = 'opacity 0.5s ease-out';
          loadingScreen.style.opacity = '0';
          setTimeout(function() {
            if (loadingScreen.parentNode) {
              loadingScreen.parentNode.removeChild(loadingScreen);
            }
          }, 500);
        }
      }, 5000);
    </script>
  </body>
</html>
