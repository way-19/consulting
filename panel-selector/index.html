<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulting19 - Panel Seçici</title>
    <style>
        body {
            font-family: 'Inter', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            max-width: 600px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            font-size: 1.2em;
            margin-bottom: 40px;
            opacity: 0.9;
        }
        
        .panel-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 30px;
        }
        
        .panel-btn {
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.3);
            color: white;
            padding: 20px 30px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: 600;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
            min-width: 180px;
        }
        
        .panel-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .panel-btn.client {
            border-color: #4CAF50;
        }
        
        .panel-btn.consultant {
            border-color: #FF9800;
        }
        
        @media (max-width: 768px) {
            .panel-buttons {
                flex-direction: column;
                align-items: center;
            }
            
            .panel-btn {
                width: 80%;
                margin: 10px 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏢 CONSULTING19</h1>
        <div class="subtitle">Panel Seçici - Direkt Erişim</div>
        
        <div class="panel-buttons">
            <a href="http://localhost:3001" class="panel-btn client">
                🏠 Client Panel<br>
                <small>Müşteri Dashboard</small>
            </a>
            <a href="http://localhost:3002" class="panel-btn consultant">
                👨‍💼 Consultant Panel<br>
                <small>Danışman Dashboard</small>
            </a>
        </div>
        
        <div style="margin-top: 30px; font-size: 0.9em; opacity: 0.7;">
            <p>✅ Her iki panel de hazır ve çalışır durumda</p>
            <p>🔄 Direkt bağlantı - döngü yok</p>
            <p>🎯 Demo için ideal çözüm</p>
        </div>
    </div>
    
    <script>
        console.log('Panel seçici hazır - direkt bağlantılar');
    </script>
</body>
</html>
