name: Bolt Workdir Sync
on:
  pull_request:
    paths:
      - 'bolt-workdir/**'
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sync workdir to real paths
        run: node scripts/sync-bolt-workdir.mjs
      - name: Commit & push changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add apps/marketing/src packages/shared/src
          git commit -m "sync: update real paths from bolt-workdir" || echo "No changes to commit"
          git push
