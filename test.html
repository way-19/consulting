<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Sayfası</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
        }
        h1 { font-size: 2em; margin-bottom: 20px; }
        .status { background: #4CAF50; padding: 10px 20px; border-radius: 10px; margin: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎉 CONSULTING19 TEST SAYFASI</h1>
        <div class="status">✅ HTML Yüklendi</div>
        <div class="status">✅ CSS Çalışıyor</div>
        <div class="status">✅ Nginx Aktif</div>
        <p>Bu sayfa görünüyorsa sistem temel olarak çalışıyor demektir.</p>
        <script>
            document.body.innerHTML += '<div class="status">✅ JavaScript Çalışıyor</div>';
        </script>
    </div>
</body>
</html>
