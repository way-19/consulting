<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulting19 - Smart Panel Switch</title>
    <style>
        body {
            font-family: 'Inter', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .control-bar {
            background: rgba(0,0,0,0.2);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            backdrop-filter: blur(10px);
        }
        
        .title {
            font-size: 1.5em;
            font-weight: 700;
        }
        
        .switch-buttons {
            display: flex;
            gap: 10px;
        }
        
        .switch-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
            text-decoration: none;
            display: inline-block;
        }
        
        .switch-btn:hover {
            background: rgba(255,255,255,0.4);
            transform: translateY(-2px);
        }
        
        .switch-btn.active {
            background: rgba(255,255,255,0.9);
            color: #667eea;
        }
        
        .panel-frame {
            flex: 1;
            width: 100%;
            border: none;
            background: white;
        }
        
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 1.2em;
            z-index: 1000;
            visibility: hidden;
        }
        
        .loading-overlay.show {
            visibility: visible;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .status-info {
            font-size: 0.9em;
            opacity: 0.8;
        }
        
        @media (max-width: 768px) {
            .control-bar {
                flex-direction: column;
                gap: 15px;
                padding: 15px;
            }
            
            .switch-buttons {
                width: 100%;
                justify-content: center;
            }
            
            .switch-btn {
                flex: 1;
                margin: 0 5px;
                padding: 10px 15px;
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <div class="control-bar">
        <div class="title">🏢 CONSULTING19</div>
        <div class="switch-buttons">
            <button class="switch-btn active" onclick="switchToClient()" id="clientBtn">
                🏠 Client Panel
            </button>
            <button class="switch-btn" onclick="switchToConsultant()" id="consultantBtn">
                👨‍💼 Consultant Panel
            </button>
            <button class="switch-btn" onclick="refreshCurrent()">
                🔄 Yenile
            </button>
        </div>
        <div class="status-info" id="statusInfo">
            Client Panel Aktif
        </div>
    </div>
    
    <iframe class="panel-frame" id="mainFrame" src="about:blank"></iframe>
    
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div id="loadingText">Panel değiştiriliyor...</div>
    </div>
    
    <script>
        const BASE_URL = 'https://d1215cd3-9403-432a-9c3f-3dce0d82082f.preview.emergentagent.com';
        let currentPanel = 'client';
        let isLoading = false;
        
        function showLoading(text) {
            if (isLoading) return;
            isLoading = true;
            
            document.getElementById('loadingText').textContent = text;
            document.getElementById('loadingOverlay').classList.add('show');
        }
        
        function hideLoading() {
            setTimeout(() => {
                document.getElementById('loadingOverlay').classList.remove('show');
                isLoading = false;
            }, 1500);
        }
        
        function loadPanel(url, panelName) {
            const frame = document.getElementById('mainFrame');
            frame.src = url;
            
            frame.onload = function() {
                hideLoading();
                console.log(panelName + ' panel loaded successfully');
            };
            
            frame.onerror = function() {
                hideLoading();
                console.error('Error loading ' + panelName + ' panel');
            };
        }
        
        function switchToClient() {
            if (currentPanel === 'client' && !isLoading) return;
            
            showLoading('Client Panel yükleniyor...');
            currentPanel = 'client';
            
            // Backend'e client panel gösterilmesi için komut gönder
            fetch('/api/switch-panel', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ panel: 'client' })
            }).catch(() => {
                // Hata olursa direkt URL load et
                setTimeout(() => {
                    loadPanel(BASE_URL, 'Client');
                }, 500);
            });
            
            // Her durumda panel yükle
            setTimeout(() => {
                loadPanel(BASE_URL, 'Client');
            }, 1000);
            
            updateActiveButton('client');
            document.getElementById('statusInfo').textContent = 'Client Panel Aktif';
        }
        
        function switchToConsultant() {
            if (currentPanel === 'consultant' && !isLoading) return;
            
            showLoading('Consultant Panel yükleniyor...');
            currentPanel = 'consultant';
            
            // Backend'e consultant panel gösterilmesi için komut gönder
            fetch('/api/switch-panel', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ panel: 'consultant' })
            }).catch(() => {
                // Hata olursa direkt consultant panel yükle
                setTimeout(() => {
                    loadPanel(BASE_URL, 'Consultant');
                }, 500);
            });
            
            // Her durumda panel yükle
            setTimeout(() => {
                loadPanel(BASE_URL, 'Consultant');
            }, 1000);
            
            updateActiveButton('consultant');
            document.getElementById('statusInfo').textContent = 'Consultant Panel Aktif';
        }
        
        function refreshCurrent() {
            if (currentPanel === 'client') {
                switchToClient();
            } else {
                switchToConsultant();
            }
        }
        
        function updateActiveButton(activePanel) {
            document.getElementById('clientBtn').classList.toggle('active', activePanel === 'client');
            document.getElementById('consultantBtn').classList.toggle('active', activePanel === 'consultant');
        }
        
        // Sayfa yüklendiğinde client panel'i başlat
        window.onload = function() {
            console.log('Smart Panel Switch initialized');
            setTimeout(() => {
                switchToClient();
            }, 500);
        };
        
        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey || e.metaKey) {
                if (e.key === '1') {
                    e.preventDefault();
                    switchToClient();
                } else if (e.key === '2') {
                    e.preventDefault();
                    switchToConsultant();
                } else if (e.key === 'r') {
                    e.preventDefault();
                    refreshCurrent();
                }
            }
        });
    </script>
</body>
</html>
