<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulting19 - Dual Panel System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            overflow: hidden;
        }
        
        .control-bar {
            background: rgba(0,0,0,0.3);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 1000;
        }
        
        .logo {
            font-size: 1.8em;
            font-weight: 700;
        }
        
        .panel-controls {
            display: flex;
            gap: 15px;
        }
        
        .panel-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
            font-size: 1em;
        }
        
        .panel-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }
        
        .panel-btn.active {
            background: rgba(255,255,255,0.9);
            color: #667eea;
        }
        
        .iframe-container {
            height: calc(100vh - 70px);
            width: 100%;
            position: relative;
        }
        
        .panel-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }
        
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 1.2em;
            z-index: 999;
            visibility: hidden;
        }
        
        .loading-overlay.show {
            visibility: visible;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .status-info {
            font-size: 0.9em;
            opacity: 0.8;
        }
        
        @media (max-width: 768px) {
            .control-bar {
                flex-direction: column;
                gap: 10px;
                padding: 15px;
            }
            
            .panel-controls {
                justify-content: center;
                flex-wrap: wrap;
            }
            
            .panel-btn {
                padding: 10px 20px;
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <div class="control-bar">
        <div class="logo">🏢 CONSULTING19 - DUAL SYSTEM</div>
        <div class="panel-controls">
            <button class="panel-btn active" id="clientBtn" onclick="switchToClient()">
                🏠 Client Panel
            </button>
            <button class="panel-btn" id="consultantBtn" onclick="switchToConsultant()">
                👨‍💼 Consultant Panel
            </button>
            <button class="panel-btn" onclick="refreshCurrent()">
                🔄 Yenile
            </button>
        </div>
        <div class="status-info" id="statusInfo">
            Client Panel Aktif
        </div>
    </div>
    
    <div class="iframe-container">
        <iframe class="panel-frame" id="mainFrame" src="iframe-client.html"></iframe>
        
        <div class="loading-overlay" id="loadingOverlay">
            <div class="spinner"></div>
            <div id="loadingText">Panel yükleniyor...</div>
        </div>
    </div>
    
    <script>
        let currentPanel = 'client';
        let isLoading = false;
        
        function showLoading(text) {
            if (isLoading) return;
            isLoading = true;
            
            document.getElementById('loadingText').textContent = text;
            document.getElementById('loadingOverlay').classList.add('show');
        }
        
        function hideLoading() {
            setTimeout(() => {
                document.getElementById('loadingOverlay').classList.remove('show');
                isLoading = false;
            }, 1500);
        }
        
        function updateButtons(activePanel) {
            document.getElementById('clientBtn').classList.toggle('active', activePanel === 'client');
            document.getElementById('consultantBtn').classList.toggle('active', activePanel === 'consultant');
        }
        
        function switchToClient() {
            if (currentPanel === 'client' || isLoading) return;
            
            showLoading('Client Panel yükleniyor...');
            currentPanel = 'client';
            
            setTimeout(() => {
                document.getElementById('mainFrame').src = 'iframe-client.html';
                updateButtons('client');
                document.getElementById('statusInfo').textContent = 'Client Panel Aktif';
                hideLoading();
            }, 1000);
        }
        
        function switchToConsultant() {
            if (currentPanel === 'consultant' || isLoading) return;
            
            showLoading('Consultant Panel yükleniyor...');
            currentPanel = 'consultant';
            
            setTimeout(() => {
                document.getElementById('mainFrame').src = 'http://localhost:8001/iframe-consultant.html';
                updateButtons('consultant');
                document.getElementById('statusInfo').textContent = 'Consultant Panel Aktif';
                hideLoading();
            }, 1000);
        }
        
        function refreshCurrent() {
            if (isLoading) return;
            
            if (currentPanel === 'client') {
                switchToClient();
            } else {
                switchToConsultant();
            }
        }
        
        // Iframe'den gelen mesajları dinle
        window.addEventListener('message', function(event) {
            if (event.data === 'switch-to-consultant') {
                switchToConsultant();
            } else if (event.data === 'switch-to-client') {
                switchToClient();
            }
        });
        
        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey || e.metaKey) {
                if (e.key === '1') {
                    e.preventDefault();
                    switchToClient();
                } else if (e.key === '2') {
                    e.preventDefault();
                    switchToConsultant();
                }
            }
        });
        
        console.log('✅ Dual Panel System Loaded');
        console.log('🎮 Controls: Ctrl+1 (Client), Ctrl+2 (Consultant)');
    </script>
</body>
</html>
