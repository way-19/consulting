<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulting19 - Panel Seçici</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { background: white; border-radius: 20px; padding: 60px 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.1); text-align: center; max-width: 600px; width: 100%; }
        .logo { font-size: 2.5rem; font-weight: 700; color: #2d3748; margin-bottom: 10px; }
        .subtitle { color: #718096; font-size: 1.1rem; margin-bottom: 50px; }
        .panel-buttons { display: flex; gap: 30px; justify-content: center; flex-wrap: wrap; }
        .panel-btn { display: inline-block; padding: 20px 40px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; text-decoration: none; border-radius: 15px; font-size: 1.2rem; font-weight: 600; transition: all 0.3s ease; min-width: 200px; box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3); }
        .panel-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4); }
        .panel-btn.client { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); box-shadow: 0 10px 30px rgba(79, 172, 254, 0.3); }
        .panel-btn.client:hover { box-shadow: 0 15px 40px rgba(79, 172, 254, 0.4); }
        .panel-btn.consultant { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); box-shadow: 0 10px 30px rgba(67, 233, 123, 0.3); }
        .panel-btn.consultant:hover { box-shadow: 0 15px 40px rgba(67, 233, 123, 0.4); }
        .status { margin-top: 30px; padding: 15px; background: #f0fff4; border: 1px solid #9ae6b4; color: #22543d; border-radius: 10px; font-size: 0.9rem; }
        .timestamp { margin-top: 15px; color: #718096; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Consulting19</div>
        <div class="subtitle">Temiz Sistem - Cache Sorunu Çözüldü</div>
        
        <div class="panel-buttons">
            <a href="/client-panel.html" class="panel-btn client">
                👤 Client Panel
            </a>
            <a href="/consultant-panel.html" class="panel-btn consultant">
                💼 Consultant Panel
            </a>
        </div>
        
        <div class="status">
            ✅ Upload Sistemi Hazır | ✅ Cache Temizlendi | ✅ Sistem Yenilendi
        </div>
        
        <div class="timestamp">
            CACHE CLEARED: 2025-09-13 15:01:23 - BUILD: 1726243283
        </div>
    </div>
</body>
</html>
