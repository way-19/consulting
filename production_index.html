<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulting19 - Dashboard Selection</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 500px;
      width: 100%;
    }
    
    .logo {
      font-size: 2.5rem;
      font-weight: 700;
      color: #4F46E5;
      margin-bottom: 10px;
    }
    
    .subtitle {
      color: #6B7280;
      margin-bottom: 40px;
      font-size: 1.1rem;
    }
    
    .panel-buttons {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    
    .panel-btn {
      padding: 18px 25px;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: block;
      color: white;
    }
    
    .client-btn {
      background: linear-gradient(135deg, #3B82F6 0%, #1D4ED8 100%);
    }
    
    .client-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
    }
    
    .consultant-btn {
      background: linear-gradient(135deg, #10B981 0%, #047857 100%);
    }
    
    .consultant-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
    }
    
    .admin-btn {
      background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
    }
    
    .admin-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(245, 158, 11, 0.4);
    }
    
    .panel-btn:active {
      transform: translateY(0);
    }
    
    .icon {
      margin-right: 10px;
      font-size: 1.2rem;
    }
    
    .loading {
      display: none;
      margin-top: 20px;
      color: #6B7280;
    }
    
    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid #f3f3f3;
      border-top: 2px solid #4F46E5;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 10px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">C19</div>
    <h2 style="color: #1F2937; margin-bottom: 8px;">Consulting19</h2>
    <p class="subtitle">Select your dashboard to continue</p>
    
    <div class="panel-buttons">
      <a href="/client/" class="panel-btn client-btn">
        <span class="icon">👤</span>
        Client Dashboard
      </a>
      
      <a href="/consultant/" class="panel-btn consultant-btn">
        <span class="icon">💼</span>
        Consultant Dashboard
      </a>
      
      <a href="#" class="panel-btn admin-btn" onclick="alert('Admin panel coming soon!'); return false;">
        <span class="icon">⚙️</span>
        Admin Dashboard
      </a>
    </div>
    
    <div class="loading" id="loading">
      <div class="spinner"></div>
      Loading your dashboard...
    </div>
  </div>

  <script>
    // Debug info
    console.log('Production Panel Selector loaded');
    console.log('Available panels: Client (/client/), Consultant (/consultant/), Admin (coming soon)');
    console.log('Current URL:', window.location.href);
  </script>
</body>
</html>
